<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e8edcf"><meta name="description" content="骑进乡野，在没有目的地的小路上慢慢放松。"><title>慢慢 · 乡野骑行</title></head>
<body>
<canvas id="world" aria-label="三维乡间骑行场景"></canvas>
<div class="vignette"></div>
<header><div class="brand"><span class="brand-icon">❋</span><div>慢慢<span>MEADOW RIDE</span></div></div><div class="weather"><span class="sun">☼</span><div>晴朗的午后<span>微风 · 正适合出发</span></div></div></header>
<main id="welcome" class="welcome"><div class="eyebrow">A LITTLE RIDE, A LITTLE PEACE</div><h1>风会告诉你，<br>慢一点也很好。</h1><p>沿着乡间小路，骑过树影与花田。<br>没有终点，只有此刻。</p><button id="start" class="start" disabled>正在准备自行车…</button><span class="start-note" id="load-status" role="status">把忙碌留在身后</span></main>
<audio id="background-music" hidden></audio>
<div id="ride-ui" hidden>
<div id="ride-top">
<aside class="journey"><strong id="distance">0.00 <small>km</small></strong><span id="place-name">向着风吹来的地方</span></aside>
<div id="ride-tools" aria-label="旅途工具">
<button id="music" class="music-toggle" aria-pressed="true" title="独立控制背景音乐">♫ 音乐 · 开</button>
<details class="controls-guide"><summary>操作</summary><p>移动鼠标或按方向键转向。W / ↑ 切换加速，S / ↓ 刹车，空格暂停。</p></details>
<details id="memory-book" class="memory-book"><summary>旅途小记</summary><p id="memory-list"></p><div id="painting-options" hidden><label for="painting-select">湖边色彩</label><select id="painting-select" aria-label="再次选择已解锁的湖边画风"><option value="off">自然湖色</option><option value="impressionist">湖光习作</option></select></div><small id="memory-storage-status">保存在这台设备 · 下次仍记得</small></details>
</div>
</div>
<div id="ride-bottom">
<div id="ride-actions">
<div id="ride-cue">
<aside id="artist-encounter" class="duck-encounter" hidden aria-label="湖畔画家"><span id="artist-message" role="status"></span><button id="artist-invite">上车，一起看看湖光</button><button id="artist-leave" hidden>独自往前骑 →</button></aside>
<aside id="starry-encounter" class="duck-encounter" hidden aria-label="路边画家"><span id="starry-message" role="status"></span><button id="starry-enter">走进这幅画</button><button id="starry-skip">先往前骑 →</button><button id="starry-leave" hidden>从画里出来 →</button></aside>
<section id="animal-dialog" class="animal-dialog" hidden role="dialog" aria-modal="false" aria-labelledby="animal-title"><h2 id="animal-title"></h2><p id="animal-message" role="status"></p><div><button id="animal-invite-front">邀请坐前篮</button><button id="animal-invite-rear">邀请坐后座</button><button id="animal-leave">再见，继续骑行 →</button></div></section>
<aside id="walker-encounter" class="duck-encounter" hidden aria-label="果园同路"><span id="walker-message" role="status"></span><button id="walker-invite">下车，一起走一段</button><button id="walker-leave" hidden>先往前骑 →</button></aside>
<aside id="duck-encounter" class="duck-encounter" hidden aria-label="湖边相遇"><span id="duck-message" role="status"></span><button id="duck-wait">停一会儿，等它们过路</button><button id="duck-leave" hidden>继续骑行 →</button></aside>
<aside id="pond-lookout" class="duck-encounter" hidden aria-label="下坡池塘"><span>路旁的小池塘</span><button id="pond-watch">停一会儿看鸭子</button><button id="pond-resume" hidden>继续骑行 →</button></aside>
<aside id="grass-rest" class="grass-rest" hidden aria-label="草地小歇"><span role="status">没关系，没什么大不了。</span><button id="get-up">起来，继续骑</button></aside>
</div>
<div class="ride-modes" role="group" aria-label="自动骑行方式"><button data-ride-mode="leisure" aria-pressed="true">悠闲巡航</button><button data-ride-mode="brisk" aria-pressed="false">轻快巡航</button><button data-ride-mode="joyful" aria-pressed="false" title="空旷路段轻轻摇骑，靠近伙伴时收稳">自在摇骑</button><button data-ride-mode="chase" aria-pressed="false">追风骑行</button></div>
<div class="ride-buttons">
<footer class="controls"><div class="speed"><strong id="speed">0</strong><span>km/h</span></div><div class="divider"></div><button id="accelerate" aria-pressed="false" title="轻点切换，不用一直按住">加速</button><button id="walk" aria-pressed="false">下车推行</button><button id="view"><span>◉</span> 换个视角</button><button id="sound" aria-pressed="true" title="开启或关闭风声与鸟鸣">自然声 · 开</button><button id="pause" aria-label="暂停骑行"><span>Ⅱ</span></button></footer>
<div class="mobile-controls"><button data-key="ArrowLeft" aria-label="左转">←</button><button data-key="ArrowDown" aria-label="刹车减速">↓</button><button data-key="ArrowRight" aria-label="右转">→</button></div>
</div>
</div>
<div id="pause-layer" class="pause-layer" hidden><span>歇一会儿，也很好。</span><button id="resume">继续骑行 →</button></div>
</div>
</div>
<div class="corner-note">不赶路，感受路。</div>
<script type="module" src="/src/main.js"></script>
</body></html>
