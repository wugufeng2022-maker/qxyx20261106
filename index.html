<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#b7cfc3" />
<title>Cozy Creek · 小溪</title>
<style>
	:root { color-scheme: dark; }
	* { box-sizing: border-box; }
	html, body {
		margin: 0; padding: 0; width: 100%; height: 100%;
		overflow: hidden; background: #b8cec4;
	}
	body {
		touch-action: none; overscroll-behavior: none;
		-webkit-user-select: none; user-select: none;
		font-family: ui-serif, Georgia, "Songti SC", "Noto Serif SC", serif;
	}
	canvas { display: block; touch-action: none; }

	#vignette {
		position: fixed; inset: 0; z-index: 2; pointer-events: none;
		background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 46%, rgba(14,28,20,.26) 100%);
		mix-blend-mode: multiply;
	}
	#hint {
		position: fixed; z-index: 3; left: 50%; bottom: max(18px, env(safe-area-inset-bottom));
		transform: translateX(-50%);
		color: rgba(255,255,255,.88); font-size: 13px; letter-spacing: .12em;
		text-shadow: 0 1px 8px rgba(0,0,0,.45);
		padding: 9px 15px; border-radius: 999px;
		background: rgba(20,40,28,.22);
		-webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
		pointer-events: none; white-space: nowrap;
		transition: opacity .9s ease;
	}
	#hint.hide { opacity: 0; }

	#loading {
		position: fixed; inset: 0; z-index: 10;
		display: grid; place-items: center;
		background: linear-gradient(160deg, #e2ede4 0%, #c3d8cc 48%, #a7c1b5 100%);
		transition: opacity 1s ease, visibility 1s ease;
	}
	#loading.hidden { opacity: 0; visibility: hidden; }
	#loading .inner { text-align: center; color: #345444; transform: translateY(-4vh); }
	#loading .title {
		font-size: 22px; letter-spacing: .38em; text-transform: lowercase;
		margin-bottom: 16px; opacity: .82; text-indent: .38em;
	}
	#loading .bar {
		width: 132px; height: 2px; border-radius: 2px; overflow: hidden;
		background: rgba(52,84,68,.18); margin: 0 auto;
	}
	#loading .bar span {
		display: block; width: 44%; height: 100%; border-radius: 2px;
		background: #4d6f5c; animation: drift 1.4s ease-in-out infinite;
	}
	@keyframes drift {
		0% { transform: translateX(-110%); }
		100% { transform: translateX(340%); }
	}
</style>
</head>
<body>
<div id="loading">
	<div class="inner">
		<div class="title">cozy creek</div>
		<div class="bar"><span></span></div>
	</div>
</div>
<div id="vignette"></div>
<div id="hint">拖动旋转 · 滚轮缩放</div>

<script type="importmap">
{
	"imports": {
		"three": "https://unpkg.com/three@0.187.0/build/three.module.js",
		"three/addons/": "https://unpkg.com/three@0.187.0/examples/jsm/"
	}
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Water } from 'three/addons/objects/Water.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ------------------------------------------------------------------ */
/*  Setup                                                              */
/* ------------------------------------------------------------------ */

const MOBILE = matchMedia('(pointer: coarse)').matches || innerWidth < 760;
const DPR_CAP = MOBILE ? 1.5 : 2;
const WATER_Y = 0;
const WORLD = 150;
const NORMAL_URL = 'https://threejs.org/examples/textures/waternormals.jpg';

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
function smoothstep(edge0, edge1, x) {
	const t = clamp((x - edge0) / (edge1 - edge0), 0, 1);
	return t * t * (3 - 2 * t);
}
function mulberry32(seed) {
	let a = seed >>> 0;
	return function () {
		a |= 0;
		a = (a + 0x6D2B79F5) | 0;
		let t = Math.imul(a ^ (a >>> 15), 1 | a);
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	};
}
function hash2(x, z) {
	const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453123;
	return s - Math.floor(s);
}

const rng = mulberry32(0x5eedc0de);

const renderer = new THREE.WebGLRenderer({
	antialias: true,
	powerPreference: 'high-performance'
});
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, DPR_CAP));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.14;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);

const camera = new THREE.PerspectiveCamera(52, innerWidth / innerHeight, 0.1, 700);
camera.layers.enable(1);

const scene = new THREE.Scene();
const FOG_COLOR = 0xb6cbc3;
scene.background = new THREE.Color(FOG_COLOR);
scene.fog = new THREE.FogExp2(FOG_COLOR, 0.017);

/* ------------------------------------------------------------------ */
/*  Sky and light                                                      */
/* ------------------------------------------------------------------ */

const sunDirection = new THREE.Vector3(0.38, 0.6, 0.65).normalize();

function makeSkyTexture() {
	const width = 1024;
	const height = 512;
	const canvas = document.createElement('canvas');
	canvas.width = width;
	canvas.height = height;
	const ctx = canvas.getContext('2d');

	const gradient = ctx.createLinearGradient(0, 0, 0, height);
	gradient.addColorStop(0, '#4f86b7');
	gradient.addColorStop(0.24, '#7aa8c9');
	gradient.addColorStop(0.43, '#a7c6d0');
	gradient.addColorStop(0.52, '#d4e3dc');
	gradient.addColorStop(0.64, '#d0dfd4');
	gradient.addColorStop(1, '#c2d3c5');
	ctx.fillStyle = gradient;
	ctx.fillRect(0, 0, width, height);

	// Soft sun glow, positioned to roughly match the directional light.
	const phi = Math.atan2(sunDirection.z, sunDirection.x);
	let sunU = (Math.PI - phi) / (Math.PI * 2);
	sunU -= Math.floor(sunU);
	const sunV = 1 - Math.acos(clamp(sunDirection.y, -1, 1)) / Math.PI;
	const sx = sunU * width;
	const sy = (1 - sunV) * height;
	const glow = ctx.createRadialGradient(sx, sy, 0, sx, sy, 165);
	glow.addColorStop(0, 'rgba(255, 244, 213, 0.88)');
	glow.addColorStop(0.12, 'rgba(255, 235, 192, 0.38)');
	glow.addColorStop(0.5, 'rgba(255, 231, 192, 0.1)');
	glow.addColorStop(1, 'rgba(255, 231, 192, 0)');
	ctx.fillStyle = glow;
	ctx.fillRect(0, 0, width, height);

	// High, soft cloud banks.
	const cloudRng = mulberry32(0x51c10);
	for (let i = 0; i < 22; i++) {
		const cx = cloudRng() * width;
		const cy = height * (0.16 + cloudRng() * 0.3);
		const rx = 45 + cloudRng() * 145;
		const ry = 7 + cloudRng() * 22;
		const alpha = 0.06 + cloudRng() * 0.13;
		const puff = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
		puff.addColorStop(0, `rgba(255,255,255,${alpha.toFixed(3)})`);
		puff.addColorStop(0.58, `rgba(255,255,255,${(alpha * 0.5).toFixed(3)})`);
		puff.addColorStop(1, 'rgba(255,255,255,0)');
		ctx.save();
		ctx.translate(cx, cy);
		ctx.scale(1, ry / rx);
		ctx.fillStyle = puff;
		ctx.beginPath();
		ctx.arc(0, 0, rx, 0, Math.PI * 2);
		ctx.fill();
		ctx.restore();
	}

	const texture = new THREE.CanvasTexture(canvas);
	texture.colorSpace = THREE.SRGBColorSpace;
	texture.wrapS = THREE.RepeatWrapping;
	texture.anisotropy = Math.min(4, renderer.capabilities.getMaxAnisotropy());
	return texture;
}

const sky = new THREE.Mesh(
	new THREE.SphereGeometry(300, 32, 16),
	new THREE.MeshBasicMaterial({
		map: makeSkyTexture(),
		side: THREE.BackSide,
		depthWrite: false,
		fog: false,
		toneMapped: false
	})
);
sky.renderOrder = -1;
scene.add(sky);

const hemi = new THREE.HemisphereLight(0xcfe4f4, 0x3c4a2b, 1.05);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffdfb5, 2.35);
sun.position.copy(sunDirection).multiplyScalar(80);
sun.target.position.set(0, 0, 8);
sun.castShadow = true;
sun.shadow.mapSize.set(MOBILE ? 1024 : 2048, MOBILE ? 1024 : 2048);
sun.shadow.camera.left = -62;
sun.shadow.camera.right = 62;
sun.shadow.camera.top = 62;
sun.shadow.camera.bottom = -62;
sun.shadow.camera.near = 1;
sun.shadow.camera.far = 190;
sun.shadow.bias = -0.0008;
sun.shadow.normalBias = 0.06;
sun.shadow.camera.updateProjectionMatrix();
scene.add(sun, sun.target);

/* ------------------------------------------------------------------ */
/*  Creek path and terrain                                             */
/* ------------------------------------------------------------------ */

const creekCurve = new THREE.CatmullRomCurve3([
	new THREE.Vector3(-2, 0, -68),
	new THREE.Vector3(7, 0, -56),
	new THREE.Vector3(2, 0, -44),
	new THREE.Vector3(-8, 0, -32),
	new THREE.Vector3(-11, 0, -18),
	new THREE.Vector3(-3, 0, -6),
	new THREE.Vector3(8, 0, 6),
	new THREE.Vector3(11, 0, 18),
	new THREE.Vector3(4, 0, 30),
	new THREE.Vector3(-7, 0, 42),
	new THREE.Vector3(-5, 0, 54),
	new THREE.Vector3(3, 0, 68)
], false, 'centripetal');

creekCurve.arcLengthDivisions = 700;
const creekLength = creekCurve.getLength();
const CREEK_SAMPLES = 320;
const creekSamples = [];

function creekHalfWidth(t) {
	return 2.2 + 0.72 * Math.sin(t * Math.PI * 3.3 + 0.7) + 0.22 * Math.sin(t * 13.0 + 2.1);
}

for (let i = 0; i <= CREEK_SAMPLES; i++) {
	const t = i / CREEK_SAMPLES;
	const p = creekCurve.getPointAt(t);
	const tangent = creekCurve.getTangentAt(t);
	const inv = 1 / Math.max(1e-5, Math.hypot(tangent.x, tangent.z));
	creekSamples.push({
		t, x: p.x, z: p.z,
		nx: -tangent.z * inv,
		nz: tangent.x * inv,
		halfWidth: creekHalfWidth(t)
	});
}

function nearestCreek(x, z) {
	let bestSq = Infinity;
	let best = creekSamples[0];
	for (let i = 0; i < creekSamples.length; i++) {
		const s = creekSamples[i];
		const dx = x - s.x;
		const dz = z - s.z;
		const d2 = dx * dx + dz * dz;
		if (d2 < bestSq) {
			bestSq = d2;
			best = s;
		}
	}
	return { dist: Math.sqrt(bestSq), s: best };
}

function terrainHeight(x, z, near) {
	const n = near || nearestCreek(x, z);
	const d = n.dist;
	const half = n.s.halfWidth;
	let channel;

	if (d < half) {
		const q = d / half;
		channel = 0.04 - 0.92 * (1 - q * q);
	} else {
		const bank = smoothstep(half, half + 2.6, d);
		channel = 0.04 + bank * (1.15 + 0.18 * Math.sin(n.s.t * 26.0));
	}

	const meadow = 1.2
		+ 0.32 * Math.sin(x * 0.14 + 1.7) * Math.cos(z * 0.11 - 0.4)
		+ 0.14 * Math.sin(x * 0.43 + z * 0.27 + 2.2);

	return channel + (meadow - channel) * smoothstep(half + 1.9, half + 7.0, d);
}

const terrainSegments = MOBILE ? 120 : 190;
const terrainGeometry = new THREE.PlaneGeometry(WORLD, WORLD, terrainSegments, terrainSegments);
terrainGeometry.rotateX(-Math.PI / 2);

const terrainPositions = terrainGeometry.attributes.position;
const terrainColors = new Float32Array(terrainPositions.count * 3);

const cSand = new THREE.Color(0x81745a);
const cWetSand = new THREE.Color(0x4f4c3b);
const cGrassA = new THREE.Color(0x2e471f);
const cGrassB = new THREE.Color(0x637d3c);
const cMoss = new THREE.Color(0x3d5527);
const tmpColor = new THREE.Color();
const tmpGrass = new THREE.Color();

for (let i = 0; i < terrainPositions.count; i++) {
	const x = terrainPositions.getX(i);
	const z = terrainPositions.getZ(i);
	const near = nearestCreek(x, z);
	const h = terrainHeight(x, z, near);
	terrainPositions.setY(i, h);

	const tint = 0.5 + 0.5 * Math.sin(x * 0.45 + z * 0.37 + Math.sin(x * 0.11) * 1.8);
	const grain = hash2(x, z);

	// Submerged bed fades from pale sand at the shore to dark wet pebbles.
	tmpColor.copy(cSand).lerp(cWetSand, smoothstep(0.12, -0.55, h));
	tmpColor.multiplyScalar(0.88 + grain * 0.2);

	tmpGrass.copy(cGrassA).lerp(cGrassB, tint * 0.7 + grain * 0.3);
	if (near.dist < near.s.halfWidth + 3.5) tmpGrass.lerp(cMoss, 0.32);
	tmpColor.lerp(tmpGrass, smoothstep(0.02, 0.18, h));

	if (h < 0.1 && grain > 0.93) tmpColor.lerp(cWetSand, 0.55);

	terrainColors[i * 3] = tmpColor.r;
	terrainColors[i * 3 + 1] = tmpColor.g;
	terrainColors[i * 3 + 2] = tmpColor.b;
}

function makeGroundTexture() {
	const size = 256;
	const canvas = document.createElement('canvas');
	canvas.width = canvas.height = size;
	const context = canvas.getContext('2d');
	const image = context.createImageData(size, size);
	const tau = Math.PI * 2;

	for (let y = 0; y < size; y++) {
		for (let x = 0; x < size; x++) {
			const u = (x / size) * tau;
			const v = (y / size) * tau;
			const broad = 0.5 + 0.5 * Math.sin(u * 3 + v * 2 + Math.sin(u * 5) * 1.2)
				* Math.cos(v * 4 - u * 2);
			const fine = 0.5 + 0.5 * Math.sin(u * 13 + Math.cos(v * 9) * 1.4)
				* Math.cos(v * 11 - u * 5);
			const fleck = hash2(x * 0.73, y * 0.91);
			const gray = clamp(202 + broad * 44 + fine * 20 + (fleck > 0.9 ? -52 : 0), 0, 255);
			const index = (y * size + x) * 4;
			image.data[index] = gray;
			image.data[index + 1] = gray;
			image.data[index + 2] = gray;
			image.data[index + 3] = 255;
		}
	}

	context.putImageData(image, 0, 0);

	// Fine grass strokes keep the meadow from reading as flat paint.
	const strokeRng = mulberry32(0x51ab);
	context.lineCap = 'round';
	for (let i = 0; i < 3600; i++) {
		const x = strokeRng() * size;
		const y = strokeRng() * size;
		const length = 3 + strokeRng() * 12;
		const lean = (strokeRng() - 0.5) * 4.5;
		const shade = strokeRng() > 0.55 ? 108 + strokeRng() * 54 : 218 + strokeRng() * 33;
		context.strokeStyle = `rgba(${shade}, ${shade}, ${shade}, ${0.18 + strokeRng() * 0.28})`;
		context.lineWidth = 0.7 + strokeRng() * 1.5;
		context.beginPath();
		context.moveTo(x, y);
		context.lineTo(x + lean, y - length);
		context.stroke();
	}

	const texture = new THREE.CanvasTexture(canvas);
	texture.wrapS = texture.wrapT = THREE.RepeatWrapping;
	texture.repeat.set(22, 22);
	texture.colorSpace = THREE.SRGBColorSpace;
	texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
	return texture;
}

terrainGeometry.setAttribute('color', new THREE.BufferAttribute(terrainColors, 3));
terrainGeometry.computeVertexNormals();

const terrain = new THREE.Mesh(
	terrainGeometry,
	new THREE.MeshStandardMaterial({
		vertexColors: true,
		roughness: 0.98,
		metalness: 0,
		map: makeGroundTexture()
	})
);
terrain.receiveShadow = true;
scene.add(terrain);

/* ------------------------------------------------------------------ */
/*  Rocks and pebbles                                                  */
/* ------------------------------------------------------------------ */

function makeRockGeometry(seed) {
	const geometry = new THREE.IcosahedronGeometry(1, 1);
	const position = geometry.attributes.position;
	const v = new THREE.Vector3();

	for (let i = 0; i < position.count; i++) {
		v.fromBufferAttribute(position, i);
		const n = 1
			+ 0.18 * Math.sin(v.x * 3.1 + v.y * 4.7 + v.z * 2.3 + seed)
			+ 0.09 * Math.sin(v.x * 7.7 - v.z * 5.1 + seed * 1.7);
		v.multiplyScalar(n);
		v.y *= 0.78;
		position.setXYZ(i, v.x, v.y, v.z);
	}

	geometry.computeVertexNormals();
	return geometry;
}

const rockPalette = [0x686558, 0x716d60, 0x555b4a, 0x63594a, 0x4d5b42];
const rockMaterial = new THREE.MeshStandardMaterial({
	roughness: 0.96,
	metalness: 0.02,
	flatShading: true
});

const ROCK_CAPACITY = 40;
const rockMesh = new THREE.InstancedMesh(makeRockGeometry(2.1), rockMaterial, ROCK_CAPACITY);
rockMesh.castShadow = true;
rockMesh.receiveShadow = true;

const rockDummy = new THREE.Object3D();
const rockColor = new THREE.Color();
const foamRocks = [];
let rockCount = 0;

function addRock(x, z, size, nearWater) {
	const h = terrainHeight(x, z);
	const sy = size * (0.8 + rng() * 0.35);
	rockDummy.position.set(x, h + sy * 0.9, z);
	rockDummy.rotation.set((rng() - 0.5) * 0.4, rng() * Math.PI * 2, (rng() - 0.5) * 0.4);
	rockDummy.scale.set(
		size * (0.8 + rng() * 0.55),
		sy,
		size * (0.8 + rng() * 0.55)
	);
	rockDummy.updateMatrix();
	rockMesh.setMatrixAt(rockCount, rockDummy.matrix);

	rockColor.setHex(rockPalette[Math.floor(rng() * rockPalette.length)]);
	rockColor.multiplyScalar(0.82 + rng() * 0.3);
	if (rng() > 0.7) rockColor.lerp(new THREE.Color(0x5e7048), 0.35);
	rockMesh.setColorAt(rockCount, rockColor);

	if (nearWater && foamRocks.length < 12) {
		foamRocks.push({
			x, z,
			radius: Math.max(0.24, size * 1.02),
			seed: rng()
		});
	}
	rockCount++;
}

// A handful of stones standing in the stream.
for (let i = 0; i < 9 && rockCount < ROCK_CAPACITY; i++) {
	let guard = 0;
	while (guard++ < 60) {
		const t = 0.06 + rng() * 0.88;
		const s = creekSamples[Math.floor(t * CREEK_SAMPLES)];
		const side = rng() < 0.5 ? -1 : 1;
		const lateral = side * s.halfWidth * (0.22 + rng() * 0.48);
		const x = s.x + s.nx * lateral;
		const z = s.z + s.nz * lateral;
		const h = terrainHeight(x, z);
		if (h > 0.02) continue;
		addRock(x, z, 0.38 + rng() * 0.44, true);
		break;
	}
}

// Boulders scattered along the banks.
for (let i = 0; i < 28 && rockCount < ROCK_CAPACITY; i++) {
	let guard = 0;
	while (guard++ < 40) {
		const t = 0.04 + rng() * 0.92;
		const s = creekSamples[Math.floor(t * CREEK_SAMPLES)];
		const side = rng() < 0.5 ? -1 : 1;
		const lateral = side * (s.halfWidth + 0.35 + rng() * 3.6);
		const x = s.x + s.nx * lateral;
		const z = s.z + s.nz * lateral;
		const h = terrainHeight(x, z);
		if (h < 0.08) continue;
		addRock(x, z, 0.28 + rng() * 0.6, lateral < s.halfWidth + 1.7 && h < 0.55);
		break;
	}
}

rockMesh.count = rockCount;
rockMesh.instanceMatrix.needsUpdate = true;
if (rockMesh.instanceColor) rockMesh.instanceColor.needsUpdate = true;
rockMesh.computeBoundingSphere();
scene.add(rockMesh);

// Small pebbles on the riverbed, visible through the transparent shallows.
const pebbleCapacity = MOBILE ? 150 : 240;
const pebbleMesh = new THREE.InstancedMesh(
	new THREE.DodecahedronGeometry(0.11, 0),
	new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.0, flatShading: true }),
	pebbleCapacity
);
pebbleMesh.receiveShadow = true;
pebbleMesh.layers.set(1);

const pebbleDummy = new THREE.Object3D();
const pebbleColor = new THREE.Color();
let pebbleCount = 0;

for (let i = 0; i < pebbleCapacity; i++) {
	const t = 0.05 + rng() * 0.9;
	const s = creekSamples[Math.floor(t * CREEK_SAMPLES)];
	const shoreline = i < pebbleCapacity * 0.27;
	const side = rng() < 0.5 ? -1 : 1;
	const lateral = shoreline
		? side * s.halfWidth * (0.98 + rng() * 0.35)
		: (rng() * 2 - 1) * s.halfWidth * 0.82;
	const x = s.x + s.nx * lateral;
	const z = s.z + s.nz * lateral;
	const h = terrainHeight(x, z);
	if (shoreline && (h < 0.01 || h > 0.3)) continue;
	const scale = (shoreline ? 0.4 : 0.55) + rng() * (shoreline ? 0.75 : 1.5);

	pebbleDummy.position.set(x, h + 0.035, z);
	pebbleDummy.rotation.set(rng() * Math.PI, rng() * Math.PI, rng() * Math.PI);
	pebbleDummy.scale.set(scale, scale * (0.55 + rng() * 0.4), scale);
	pebbleDummy.updateMatrix();
	pebbleMesh.setMatrixAt(pebbleCount, pebbleDummy.matrix);

	pebbleColor.setHex([0x82775e, 0x6e6857, 0x8b7d63, 0x5d5b4b][Math.floor(rng() * 4)]);
	pebbleColor.multiplyScalar(0.8 + rng() * 0.3);
	pebbleMesh.setColorAt(pebbleCount, pebbleColor);
	pebbleCount++;
}

pebbleMesh.count = pebbleCount;
pebbleMesh.instanceMatrix.needsUpdate = true;
if (pebbleMesh.instanceColor) pebbleMesh.instanceColor.needsUpdate = true;
pebbleMesh.computeBoundingSphere();
scene.add(pebbleMesh);

/* ------------------------------------------------------------------ */
/*  Grass                                                              */
/* ------------------------------------------------------------------ */

function makeGrassTexture() {
	const size = 256;
	const canvas = document.createElement('canvas');
	canvas.width = canvas.height = size;
	const context = canvas.getContext('2d');
	const random = mulberry32(0x6a55);
	context.clearRect(0, 0, size, size);

	for (let i = 0; i < 24; i++) {
		const baseX = size * 0.5 + (random() - 0.5) * size * 0.6;
		const baseY = size + 3;
		const height = size * (0.26 + random() * 0.34);
		const tipX = baseX + (random() - 0.5) * size * 0.46;
		const ctrlX = baseX + (tipX - baseX) * 0.35 + (random() - 0.5) * 18;
		const ctrlY = baseY - height * (0.35 + random() * 0.3);
		const width = 2.4 + random() * 4.2;

		context.beginPath();
		context.moveTo(baseX - width, baseY);
		context.quadraticCurveTo(ctrlX - width * 0.35, ctrlY, tipX, baseY - height);
		context.quadraticCurveTo(ctrlX + width * 0.5, ctrlY, baseX + width, baseY);
		context.closePath();
		context.fillStyle = `hsl(${80 + random() * 24}, ${32 + random() * 24}%, ${23 + random() * 22}%)`;
		context.globalAlpha = 0.75 + random() * 0.25;
		context.fill();
	}

	context.globalAlpha = 1;
	const texture = new THREE.CanvasTexture(canvas);
	texture.colorSpace = THREE.SRGBColorSpace;
	texture.generateMipmaps = false;
	texture.minFilter = THREE.LinearFilter;
	texture.magFilter = THREE.LinearFilter;
	texture.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
	return texture;
}

function makeGrassCardGeometry() {
	const a = new THREE.PlaneGeometry(1, 1, 1, 1);
	a.translate(0, 0.5, 0);
	const b = a.clone();
	b.rotateY(Math.PI / 3);
	const c = a.clone();
	c.rotateY(Math.PI * 2 / 3);
	const geometry = mergeGeometries([a, b, c], false);
	a.dispose();
	b.dispose();
	c.dispose();
	return geometry;
}

const grassTime = { value: 0 };
const grassMaterial = new THREE.MeshLambertMaterial({
	map: makeGrassTexture(),
	alphaTest: 0.38,
	side: THREE.DoubleSide
});

grassMaterial.onBeforeCompile = (shader) => {
	shader.uniforms.uTime = grassTime;
	shader.vertexShader = shader.vertexShader
		.replace(
			'#include <common>',
			'#include <common>\nuniform float uTime;'
		)
		.replace(
			'#include <begin_vertex>',
			`#include <begin_vertex>
			float swayHeight = max(position.y, 0.0);
			float phase = uTime * 1.35 + instanceMatrix[3].x * 0.63 + instanceMatrix[3].z * 0.37;
			float sway = (sin(phase) * 0.055 + sin(phase * 2.17 + 2.0) * 0.018) * swayHeight * swayHeight;
			transformed.x += sway;
			transformed.z += sway * 0.55;`
		);
};
grassMaterial.customProgramCacheKey = () => 'cozy-creek-grass-sway';

const grassCardGeometry = makeGrassCardGeometry();

function addGrass(count, mode, seed) {
	const random = mulberry32(seed);
	const mesh = new THREE.InstancedMesh(grassCardGeometry, grassMaterial, count);
	mesh.castShadow = false;
	mesh.receiveShadow = false;
	mesh.layers.set(1);

	const dummy = new THREE.Object3D();
	const color = new THREE.Color();
	let placed = 0;
	let guard = 0;

	while (placed < count && guard++ < count * 16) {
		let x, z;

		if (mode === 'meadow' && random() < 0.65) {
			const t = 0.04 + random() * 0.92;
			const s = creekSamples[Math.floor(t * CREEK_SAMPLES)];
			const side = random() < 0.5 ? -1 : 1;
			const lateral = side * (s.halfWidth + 0.45 + random() * 24);
			x = s.x + s.nx * lateral;
			z = s.z + s.nz * lateral;
		} else if (mode === 'meadow') {
			x = (random() - 0.5) * WORLD * 0.82;
			z = (random() - 0.5) * WORLD * 0.82;
		} else {
			const t = 0.04 + random() * 0.92;
			const s = creekSamples[Math.floor(t * CREEK_SAMPLES)];
			const side = random() < 0.5 ? -1 : 1;
			const lateral = side * (s.halfWidth + 0.02 + random() * 1.1);
			x = s.x + s.nx * lateral;
			z = s.z + s.nz * lateral;
		}

		const near = nearestCreek(x, z);
		if (mode === 'meadow' && near.dist < near.s.halfWidth + 0.4) continue;

		const h = terrainHeight(x, z, near);
		if (mode === 'meadow' && h < 0.16) continue;
		if (mode === 'reed' && (h < 0.015 || h > 0.7)) continue;

		const scale = mode === 'reed'
			? 0.75 + random() * 0.45
			: 0.68 + random() * 0.5;

		const widthScale = mode === 'reed'
			? 0.46 + random() * 0.24
			: 1.05 + random() * 0.48;

		dummy.position.set(x, h - 0.04, z);
		dummy.rotation.set(0, random() * Math.PI * 2, 0);
		dummy.scale.set(
			scale * widthScale,
			scale * (mode === 'reed' ? 1.5 + random() * 0.55 : 0.52 + random() * 0.3),
			scale * widthScale
		);
		dummy.updateMatrix();
		mesh.setMatrixAt(placed, dummy.matrix);

		if (mode === 'reed') {
			color.setHSL(0.18 + random() * 0.045, 0.25 + random() * 0.2, 0.62 + random() * 0.2);
		} else {
			color.setHSL(0.23 + random() * 0.06, 0.12 + random() * 0.16, 0.62 + random() * 0.28);
		}
		mesh.setColorAt(placed, color);
		placed++;
	}

	mesh.count = placed;
	mesh.instanceMatrix.needsUpdate = true;
	if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
	mesh.computeBoundingSphere();
	scene.add(mesh);
	return mesh;
}

function paintGeometry(geometry, color) {
	const g = geometry.index ? geometry.toNonIndexed() : geometry;
	if (g !== geometry) geometry.dispose();

	const count = g.attributes.position.count;
	const colors = new Float32Array(count * 3);
	for (let i = 0; i < count; i++) {
		colors[i * 3] = color.r;
		colors[i * 3 + 1] = color.g;
		colors[i * 3 + 2] = color.b;
	}
	g.setAttribute('color', new THREE.BufferAttribute(colors, 3));
	return g;
}

const treeSpecs = [
	[-18, -42, 1.25, 11],
	[19, -30, 1.05, 12],
	[-27, -8, 1.35, 13],
	[26, 4, 1.1, 14],
	[-21, 24, 1.2, 15],
	[22, 34, 1.0, 16],
	[-27, 50, 1.15, 17],
	[17, 60, 0.95, 18]
];

const trunkBaseColor = new THREE.Color(0x5b4633);
const leafPalette = [
	new THREE.Color(0x35501f),
	new THREE.Color(0x405c27),
	new THREE.Color(0x49662d),
	new THREE.Color(0x2e471c),
	new THREE.Color(0x557238)
];
const treeGeometries = [];

for (let ti = 0; ti < treeSpecs.length; ti++) {
	const [tx, tz, treeScale, seed] = treeSpecs[ti];
	const random = mulberry32(seed);
	const near = nearestCreek(tx, tz);
	if (near.dist < near.s.halfWidth + 5) continue;

	const baseY = terrainHeight(tx, tz, near) - 0.05;
	const trunkHeight = (2.2 + random() * 0.8) * treeScale;
	const localGeometries = [];

	const trunk = new THREE.CylinderGeometry(
		0.12 * treeScale,
		0.22 * treeScale,
		trunkHeight,
		6,
		1
	);
	trunk.translate(0, trunkHeight / 2, 0);
	trunk.rotateZ((random() - 0.5) * 0.07);
	localGeometries.push(paintGeometry(
		trunk,
		trunkBaseColor.clone().multiplyScalar(0.82 + random() * 0.3)
	));

	const clumps = 5 + Math.floor(random() * 3);
	for (let c = 0; c < clumps; c++) {
		const radius = (0.9 + random() * 0.7) * treeScale;
		const foliage = new THREE.IcosahedronGeometry(radius, 1);
		foliage.scale(
			1 + random() * 0.35,
			0.72 + random() * 0.38,
			1 + random() * 0.35
		);

		const angle = random() * Math.PI * 2;
		const spread = random() * 1.15 * treeScale;
		foliage.translate(
			Math.cos(angle) * spread,
			trunkHeight + (0.15 + random() * 1.15) * treeScale,
			Math.sin(angle) * spread
		);

		localGeometries.push(paintGeometry(
			foliage,
			leafPalette[Math.floor(random() * leafPalette.length)].clone()
				.multiplyScalar(0.82 + random() * 0.3)
		));
	}

	for (const g of localGeometries) {
		g.translate(tx, baseY, tz);
		treeGeometries.push(g);
	}
}

if (treeGeometries.length) {
	const mergedTrees = mergeGeometries(treeGeometries, false);
	for (const g of treeGeometries) g.dispose();

	const trees = new THREE.Mesh(
		mergedTrees,
		new THREE.MeshStandardMaterial({
			vertexColors: true,
			roughness: 0.95,
			metalness: 0,
			flatShading: true
		})
	);
	trees.castShadow = true;
	trees.receiveShadow = true;
	scene.add(trees);
}

function addFlowers(count, seed) {
	const random = mulberry32(seed);

	stemGeo.dispose();
	headGeo.dispose();

	const mesh = new THREE.InstancedMesh(
		flowerGeo,
		new THREE.MeshLambertMaterial({ vertexColors: true, side: THREE.DoubleSide }),
		count
	);
	mesh.castShadow = false;
	mesh.receiveShadow = false;
	mesh.layers.set(1);

	const dummy = new THREE.Object3D();
	const color = new THREE.Color();
	const palette = [0xfff5df, 0xffe08c, 0xffeef0, 0xe6edff, 0xffd7a1];
	let placed = 0;
	let guard = 0;

	while (placed < count && guard++ < count * 20) {
		const t = 0.04 + random() * 0.92;
		const s = creekSamples[Math.floor(t * CREEK_SAMPLES)];
		const side = random() < 0.5 ? -1 : 1;
		const lateral = side * (s.halfWidth + 0.55 + random() * 10);
		const x = s.x + s.nx * lateral;
		const z = s.z + s.nz * lateral;
		const h = terrainHeight(x, z);
		if (h < 0.22) continue;

		const scale = 0.7 + random() * 0.65;
		dummy.position.set(x, h - 0.02, z);

		dummy.updateMatrix();
		mesh.setMatrixAt(placed, dummy.matrix);

		color.setHex(palette[Math.floor(random() * palette.length)]);
		mesh.setColorAt(placed, color);
		placed++;
	}

	mesh.count = placed;
	mesh.instanceMatrix.needsUpdate = true;
	if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
	mesh.computeBoundingSphere();
	scene.add(mesh);
}

const loadingEl = document.getElementById('loading');

function revealScene() {
	if (revealed) return;

function makeFallbackNormals() {
	const size = 256;
	const canvas = document.createElement('canvas');
	canvas.width = canvas.height = size;
	const context = canvas.getContext('2d');
	const image = context.createImageData(size, size);

	for (let y = 0; y < size; y++) {
		for (let x = 0; x < size; x++) {
			const nx = Math.sin(x * 0.17 + y * 0.09) + 0.5 * Math.sin(x * 0.31 - y * 0.23);
			const ny = Math.cos(x * 0.11 - y * 0.19) + 0.5 * Math.cos(x * 0.27 + y * 0.13);
			const len = Math.hypot(nx, ny, 1);
			const index = (y * size + x) * 4;
			image.data[index] = (nx / len * 0.5 + 0.5) * 255;
			image.data[index + 1] = (ny / len * 0.5 + 0.5) * 255;
			image.data[index + 2] = (1 / len * 0.5 + 0.5) * 255;
			image.data[index + 3] = 255;
		}
	}

	context.putImageData(image, 0, 0);
	return canvas;
}

const textureLoader = new THREE.TextureLoader();
textureLoader.crossOrigin = 'anonymous';

const waterNormals = textureLoader.load(
	NORMAL_URL,
	() => revealScene(),
	undefined,
	() => {
		waterNormals.image = makeFallbackNormals();
		waterNormals.needsUpdate = true;
		revealScene();
	}
);
waterNormals.wrapS = THREE.RepeatWrapping;

function buildCreekGeometry() {
	const lengthSteps = MOBILE ? 260 : 330;
	const widthSteps = 8;
	const rows = lengthSteps + 1;
	const cols = widthSteps + 1;
	const vertexCount = rows * cols;

	const positions = new Float32Array(vertexCount * 3);
	const uvs = new Float32Array(vertexCount * 2);
	const depths = new Float32Array(vertexCount);
	const endFades = new Float32Array(vertexCount);
	const indices = [];

	for (let i = 0; i < rows; i++) {
		const t = i / lengthSteps;
		const s = creekSamples[Math.round(t * CREEK_SAMPLES)];
		const width = creekHalfWidth(t);
		const fade = smoothstep(0.0, 0.045, t) * smoothstep(1.0, 0.955, t);
		const centreDepth = 0.7 + 0.3 * Math.sin(t * 29.0 + 1.3);

		for (let j = 0; j < cols; j++) {
			const u = j / widthSteps;
			const lateral = (u * 2 - 1) * width;
			const x = s.x + s.nx * lateral;
			const z = s.z + s.nz * lateral;
			const index = i * cols + j;

			positions[index * 3] = x;
			positions[index * 3 + 1] = -z;
			positions[index * 3 + 2] = 0;

			uvs[index * 2] = u;
			uvs[index * 2 + 1] = t * creekLength / 4.2;

			depths[index] = Math.pow(Math.sin(u * Math.PI), 1.45) * centreDepth;
			endFades[index] = fade;
		}
	}

	for (let i = 0; i < lengthSteps; i++) {
		for (let j = 0; j < widthSteps; j++) {
			const a = i * cols + j;
			const b = a + 1;
			const c = a + cols;
			const d = c + 1;
			indices.push(a, b, c, b, d, c);
		}
	}

	const geometry = new THREE.BufferGeometry();
	geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
	geometry.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
	geometry.setAttribute('aDepth', new THREE.BufferAttribute(depths, 1));
	geometry.setAttribute('aEndFade', new THREE.BufferAttribute(endFades, 1));
	geometry.setIndex(indices);
	geometry.computeVertexNormals();
	return geometry;
}

const water = new Water(buildCreekGeometry(), {
	textureWidth: MOBILE ? 256 : 512,
	textureHeight: MOBILE ? 256 : 512,
	waterNormals,
	sunDirection: sunDirection.clone(),
	sunColor: 0xfff1d6,
	waterColor: 0x1b4b3b,
	distortionScale: MOBILE ? 0.95 : 1.2,
	fog: true,
	alpha: 1.0
});

water.rotation.x = -Math.PI / 2;
water.position.y = WATER_Y;
water.renderOrder = 2;
water.material.transparent = true;
water.material.depthWrite = false;
water.material.side = THREE.FrontSide;

water.material.uniforms.uDeepColor = { value: new THREE.Color(0x062f20) };
water.material.uniforms.uShallowColor = { value: new THREE.Color(0x6f9a80) };
water.material.uniforms.uRocks = {
	value: Array.from({ length: 12 }, () => new THREE.Vector4(0, 0, 0.001, 0))
};
water.material.uniforms.uRockCount = { value: 0 };

water.material.vertexShader = water.material.vertexShader
	.replace(
		`varying vec4 mirrorCoord;
				varying vec4 worldPosition;`,
		`varying vec4 mirrorCoord;
				varying vec4 worldPosition;
				varying vec2 vFlowUv;
				varying float vDepth;
				varying float vEndFade;

				attribute float aDepth;
				attribute float aEndFade;`
	)
	.replace(
		'gl_Position = projectionMatrix * mvPosition;',
		`vFlowUv = uv;
					vDepth = aDepth;
					vEndFade = aEndFade;
					gl_Position = projectionMatrix * mvPosition;`
	);

water.material.fragmentShader = water.material.fragmentShader
	.replace(
		`uniform vec3 waterColor;

				varying vec4 mirrorCoord;
				varying vec4 worldPosition;`,
		`uniform vec3 waterColor;
				uniform vec3 uDeepColor;
				uniform vec3 uShallowColor;
				uniform vec4 uRocks[ 12 ];
				uniform int uRockCount;

				varying vec4 mirrorCoord;
				varying vec4 worldPosition;
				varying vec2 vFlowUv;
				varying float vDepth;
				varying float vEndFade;

				vec4 getFlowNoise( vec2 uv ) {
					vec2 drift = vec2( 0.0, - time * 0.22 );
					vec4 n = texture2D( normalSampler, uv + drift );
					n += texture2D( normalSampler, uv * 1.63 + drift * 0.77 + vec2( 0.17, 0.31 ) );
					n += texture2D( normalSampler, uv * 0.61 + drift * 1.37 + vec2( 0.53, 0.11 ) );
					n += texture2D( normalSampler, uv * 1.21 + drift * 0.53 + vec2( 0.31, 0.73 ) );
					return n * 0.5 - 1.0;
				}`
	)
	.replace(
		'vec4 noise = getNoise( worldPosition.xz * size );',
		'vec4 noise = getFlowNoise( vec2( vFlowUv.x * 3.4, vFlowUv.y * 1.15 ) );'
	)
	.replace(
		'vec3 surfaceNormal = normalize( noise.xzy * vec3( 1.5, 1.0, 1.5 ) );',
		'vec3 surfaceNormal = normalize( noise.xzy * vec3( 1.0, 1.0, 1.0 ) );'
	)
	.replace(
		'vec3 outgoingLight = albedo;',
		`float foam = 0.0;
					for ( int i = 0; i < 12; i ++ ) {
						if ( i >= uRockCount ) break;
						vec4 rock = uRocks[ i ];
						vec2 toRock = worldPosition.xz - rock.xy;
						float rockDist = length( toRock );
						float ring = smoothstep( rock.z * 1.4, rock.z * 0.95, rockDist )
							* smoothstep( rock.z * 0.38, rock.z * 0.8, rockDist );
						float streak = 0.5 + 0.5 * sin( atan( toRock.y, toRock.x ) * 7.0 + rock.w * 6.2831 + time * 1.4 );
						foam += ring * ( 0.4 + 0.6 * streak );
					}

					float foamNoise = texture2D(
						normalSampler,
						vFlowUv * vec2( 7.0, 0.9 ) + vec2( 0.0, - time * 0.45 )
					).r;
					foam *= 0.45 + 0.8 * foamNoise;
					foam = clamp( foam, 0.0, 1.0 );

					float shore = smoothstep( 0.0, 0.035, vDepth ) * smoothstep( 0.24, 0.07, vDepth );
					shore *= 0.45 + 0.55 * foamNoise;
					foam = max( foam, shore * 0.26 );

					float fresnelMix = clamp( 0.025 + 0.975 * pow( 1.0 - theta, 5.0 ), 0.0, 1.0 );

					vec3 bodyColor = mix( uShallowColor, uDeepColor, smoothstep( 0.0, 0.85, vDepth ) );
					bodyColor *= 0.78 + 0.22 * getShadowMask();
					bodyColor += sunColor * diffuseLight * 0.06;

					vec3 outgoingLight = mix(
						bodyColor,
						reflectionSample * vec3( 0.7, 0.82, 0.78 ) + vec3( 0.008, 0.014, 0.012 ),
						fresnelMix * 0.55
					);
					outgoingLight += specularLight * 0.08;
					outgoingLight *= mix( vec3( 1.0 ), vec3( 0.84, 0.96, 0.9 ), smoothstep( 0.15, 1.0, vDepth ) );
					outgoingLight = mix( outgoingLight, vec3( 0.8, 0.92, 0.87 ), foam * 0.65 );

					float alphaOut = mix( 0.14, 0.94, smoothstep( 0.03, 0.88, vDepth ) );
					alphaOut = max( alphaOut, fresnelMix * 0.85 );
					alphaOut = max( alphaOut, foam * 0.92 );
					alphaOut = clamp( alphaOut, 0.0, 1.0 ) * vEndFade;`
	)
	.replace(
		'gl_FragColor = vec4( outgoingLight, alpha );',
		'gl_FragColor = vec4( outgoingLight, alphaOut );'
	);

water.material.needsUpdate = true;

for (let i = 0; i < Math.min(12, foamRocks.length); i++) {
	const rock = foamRocks[i];
	water.material.uniforms.uRocks.value[i].set(rock.x, rock.z, rock.radius, rock.seed);
}
water.material.uniforms.uRockCount.value = Math.min(12, foamRocks.length);

if (MOBILE) {
	const renderReflection = water.onBeforeRender;
	let reflectionTick = 0;
	water.onBeforeRender = function (...args) {
		reflectionTick++;
		if (reflectionTick % 2 === 0) renderReflection.apply(this, args);
	};
}

const initialTarget = creekCurve.getPointAt(0.2);
initialTarget.y = 0.72;

camera.position.set(initialTarget.x + 0.7, 2.9, initialTarget.z - 7.8);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(initialTarget);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.enablePan = false;
controls.rotateSpeed = 0.55;
controls.zoomSpeed = 0.8;
controls.minDistance = 3.6;
controls.maxDistance = 18;
controls.minPolarAngle = 0.32;
controls.maxPolarAngle = Math.PI * 0.47;
controls.update();

const travelTarget = new THREE.Vector3();
const travelDelta = new THREE.Vector3();
let elapsed = 0;

function updateCameraDrift(dt) {
	elapsed += dt;
	const t = 0.2 + 0.66 * (0.5 - 0.5 * Math.cos(elapsed * 0.035));
	creekCurve.getPointAt(t, travelTarget);
	travelTarget.y = 0.72;
	travelDelta.copy(travelTarget).sub(controls.target);
	camera.position.add(travelDelta);
	controls.target.copy(travelTarget);
}

function resize() {
	camera.aspect = innerWidth / innerHeight;
	camera.updateProjectionMatrix();
	renderer.setPixelRatio(Math.min(devicePixelRatio || 1, DPR_CAP));
	renderer.setSize(innerWidth, innerHeight);
}

addEventListener('resize', resize);
addEventListener('orientationchange', () => setTimeout(resize, 150));

const hint = document.getElementById('hint');
if (MOBILE) {
	hint.textContent = '单指拖动旋转 · 双指缩放';
}

const clock = THREE.Timer ? new THREE.Timer() : new THREE.Clock();
if (clock.connect) clock.connect(document);
let frameCount = 0;

renderer.setAnimationLoop(() => {
	if (clock.update) clock.update();
	const dt = Math.min(clock.getDelta(), 0.05);

	updateCameraDrift(dt);
	controls.update();

	grassTime.value = elapsed;
	water.material.uniforms.time.value += dt * 0.55;

	renderer.render(scene, camera);

	frameCount++;
	if (frameCount === 2) {
		// Everything casting shadows is static, so bake the shadow map once.
		renderer.shadowMap.autoUpdate = false;
	}
});
</script>
</body>
